<div class='card p-4'>
  <div class='flex flex-wrap items-center gap-x-6 gap-y-3'>
    <div class='flex items-center gap-2'>
      <span class='text-sm text-gray-300 font-medium'>规划模式</span>
      <div class='inline-flex rounded-lg overflow-hidden border border-gray-600'>
        <button id='modeSingle' class='px-4 py-1.5 text-sm transition'>单人</button>
        <button id='modeCouple' class='px-4 py-1.5 text-sm transition'>夫妻共同</button>
      </div>
    </div>
    <div id='spouseConfig' class='hidden flex-1 flex-wrap items-center gap-x-5 gap-y-2'>
      <div class='flex items-center gap-2'><span class='text-xs text-gray-400'>配偶年龄</span><input id='spouseAgeInput' type='number' class='w-16 text-sm'></div>
      <div class='flex items-center gap-2'><span class='text-xs text-gray-400'>配偶退休</span><input id='spouseRetireInput' type='number' class='w-16 text-sm'></div>
      <div class='flex items-center gap-2'><span class='text-xs text-gray-400'>配偶寿命</span><input id='spouseLifeInput' type='number' class='w-16 text-sm'></div>
      <div class='flex items-center gap-2'>
        <span class='text-xs text-gray-400'>配偶养老金</span>
        <select id='spousePensionSelect' class='text-sm'>
          <option value='none'>无</option>
          <option value='resident'>居民</option>
          <option value='employee'>职工</option>
          <option value='civil'>机关</option>
        </select>
        <input id='spousePensionInput' type='number' class='w-20 text-sm'>
        <span class='text-xs text-gray-500'>元/月</span>
      </div>
      <div class='flex items-center gap-2 min-w-[240px]'>
        <span class='text-xs text-gray-400'>丧偶期支出</span>
        <input id='survivorSlider' type='range' min='40' max='100' step='5' class='flex-1'>
        <span id='survivorValue' class='text-xs text-[#e94560] font-mono w-10 text-right'>65%</span>
      </div>
    </div>
    <span id='modeHint' class='text-xs text-gray-500 ml-auto'>夫妻模式：两人养老金合并、储蓄到较晚退休、支取至较晚去世，丧偶期支出自动下调。</span>
  </div>
</div>
