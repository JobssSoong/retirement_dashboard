<div class='card p-5'>
  <h3 class='text-lg font-semibold text-white border-l-4 border-[#f59e0b] pl-3 mb-4'>敏感性分析：每月需存额（购买力） <a class='cred-badge cred-infer' href='#app-corpus' data-tip='由所需储蓄额反解的模型推算值。点击查看'>推测</a></h3>
  <div id='heatmapChart' class='w-full h-[440px] rounded-xl overflow-hidden'></div>
  <div class='text-xs text-gray-500 mt-2'>横轴=投资收益率、纵轴=年通胀率，色块=在该假设下为达到「所需储蓄额」<b>每月需存多少元</b>。<span class='text-green-400'>绿区</span>需存少，<span class='text-red-400'>红区</span>需存多；白点为当前假设。</div>
  <div class='formula'>
    <span class="var">所需储蓄</span> $C=\dfrac{-F_T}{(1+r)^{T}}$（由退休支出倒推）；
    <span class="var">每月需存</span> $D$ 再由 $C$、当前已存、距退休年数按累积口径反解，$\div12$
  </div>
</div>
