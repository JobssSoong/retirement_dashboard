<div class='card p-5'>
  <div class='flex items-center justify-between mb-4 flex-wrap gap-3'>
    <h3 class='text-lg font-semibold text-white border-l-4 border-[#e94560] pl-3'>中国人口结构金字塔</h3>
    <div class='flex items-center gap-2'>
      <button id='playPyramidBtn' class='px-3 py-1.5 rounded bg-[#16213e] hover:bg-[#1e2d4d] text-white text-sm transition border border-gray-600'>播放</button>
      <input id='pyramidYearSlider' type='range' class='w-40 md:w-56'>
      <span id='pyramidYearValue' class='text-[#e94560] font-mono w-12 text-right'>2020</span>
    </div>
  </div>
  <div id='pyramidChart' class='w-full h-[420px] rounded-xl overflow-hidden'></div>
  <div class='text-xs text-gray-500 mt-2'>展示所选年份中国各年龄段男女人口分布（单位：万人）。底部指标为老龄化率与总抚养比。</div>
  <div class='source-tag' id='pyramidSource'>数据来源：联合国 UN World Population Prospects 2024（中方案，1950–2090），十年锚点为真实值、中间年份为线性插值；2020 与第七次全国人口普查总量交叉核对一致（差异 &lt;1%）。</div>
  <div class='grid grid-cols-2 gap-4 mt-4'>
    <div class='bg-[#16213e]/50 rounded-lg p-3 text-center border border-gray-700/50'>
      <div class='text-xs text-gray-400'>老龄化率 (65+/总人口)</div>
      <div id='agingRate' class='text-xl font-bold text-white mt-1'>--</div>
    </div>
    <div class='bg-[#16213e]/50 rounded-lg p-3 text-center border border-gray-700/50'>
      <div class='text-xs text-gray-400'>抚养比</div>
      <div id='dependencyRatio' class='text-xl font-bold text-white mt-1'>--</div>
    </div>
  </div>
</div>
