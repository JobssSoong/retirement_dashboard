<div class='card p-5'>
  <div class='grid grid-cols-1 lg:grid-cols-3 gap-6'>
    <div class='space-y-5'>
      <h3 class='text-lg font-semibold text-white border-l-4 border-[#e94560] pl-3'>攒钱期 · 参数</h3>
      <div class='flex gap-2 flex-wrap'>
        <button data-preset='conservative' class='preset-btn px-3 py-1.5 rounded bg-[#16213e] hover:bg-[#1e2d4d] text-xs text-gray-300 border border-gray-700 transition'>保守</button>
        <button data-preset='balanced' class='preset-btn px-3 py-1.5 rounded bg-[#16213e] hover:bg-[#1e2d4d] text-xs text-gray-300 border border-gray-700 transition'>平衡</button>
        <button data-preset='aggressive' class='preset-btn px-3 py-1.5 rounded bg-[#16213e] hover:bg-[#1e2d4d] text-xs text-gray-300 border border-gray-700 transition'>进取</button>
      </div>
      <div class='grid grid-cols-2 gap-4'>
        <div class='space-y-3'>
          <div class='text-xs text-gray-400 font-medium'>本人</div>
          <div>
            <div class='flex justify-between text-xs mb-1'><span class='text-gray-300'>当前年龄</span><span class='text-[#e94560] font-mono' id='currentAgeValue'>--</span></div>
            <div class='flex items-center gap-2'><input id='currentAgeSlider' type='range' class='flex-1'><input id='currentAgeInput' type='number' class='w-16 text-sm'></div>
          </div>
          <div>
            <div class='flex justify-between text-xs mb-1'><span class='text-gray-300'>退休年龄</span><span class='text-[#e94560] font-mono' id='targetAgeValue'>--</span></div>
            <div class='flex items-center gap-2'><input id='targetAgeSlider' type='range' class='flex-1'><input id='targetAgeInput' type='number' class='w-16 text-sm'></div>
          </div>
        </div>
        <div class='space-y-3'>
          <div class='text-xs text-gray-400 font-medium'>配偶</div>
          <div>
            <div class='flex justify-between text-xs mb-1'><span class='text-gray-300'>当前年龄</span><span class='text-[#e94560] font-mono' id='spouseAgeValue'>--</span></div>
            <div class='flex items-center gap-2'><input id='spouseAgeSlider' type='range' class='flex-1'><input id='spouseAgeInput' type='number' class='w-16 text-sm'></div>
          </div>
          <div>
            <div class='flex justify-between text-xs mb-1'><span class='text-gray-300'>退休年龄</span><span class='text-[#e94560] font-mono' id='spouseRetireValue'>--</span></div>
            <div class='flex items-center gap-2'><input id='spouseRetireSlider' type='range' class='flex-1'><input id='spouseRetireInput' type='number' class='w-16 text-sm'></div>
          </div>
        </div>
      </div>
      <div>
        <div class='flex justify-between text-sm mb-1'><span class='text-gray-300'>年通胀率</span><span class='text-[#e94560] font-mono' id='inflationValue'>--</span></div>
        <div class='flex items-center gap-3'><input id='inflationSlider' type='range' class='flex-1'><input id='inflationInput' type='number' class='w-20 text-sm'></div>
        <div class='text-xs text-gray-500 mt-1' id='inflationHint'>--</div>
      </div>
      <div>
        <div class='flex justify-between text-sm mb-1'><span class='text-gray-300'>投资收益率</span><span class='text-[#e94560] font-mono' id='returnRateValue'>--</span></div>
        <div class='flex items-center gap-3'><input id='returnRateSlider' type='range' class='flex-1'><input id='returnRateInput' type='number' class='w-20 text-sm'></div>
        <div class='text-xs text-gray-500 mt-1' id='returnRateHint'>--</div>
      </div>
      <div>
        <div class='flex justify-between text-sm mb-1'><span class='text-gray-300'>家庭已存金额</span><span class='text-[#e94560] font-mono' id='currentSavingsValue'>--</span></div>
        <div class='flex items-center gap-3'><input id='currentSavingsSlider' type='range' class='flex-1'><input id='currentSavingsInput' type='number' class='w-20 text-sm'></div>
      </div>
    </div>
    <div class='lg:col-span-2'>
      <div class='bg-[#16213e]/60 rounded-lg p-3 mb-3 flex items-center justify-between border border-gray-700/40'>
        <span class='text-sm text-gray-300'>为此家庭需每月存入</span>
        <span id='growthDepositReadout' class='text-[#e94560] font-bold text-lg kpi-number'>--</span>
      </div>
      <div id='growthChart' class='w-full h-[400px] md:h-[500px] rounded-xl overflow-hidden'></div>
      <div class='text-xs text-gray-500 mt-2'>家庭账户累积增长（账面）：当前已存 + 每月按计划存入，两人均退休时达到所需储蓄额峰值（绿线）。</div>
      <div class='formula'>
        <span class="var">逐年余额</span> $B_t=B_{t-1}(1+r)+D_t$，$D_t=D\,(1+\pi)^t$；存款持续到较晚退休者，之后进入支取期
      </div>
    </div>
  </div>
  <div class='source-tag'>法定退休年龄参考：男 60 / 女干部 55 / 女工人 50（2025 年起渐进式延迟法定退休年龄）。</div>
</div>
