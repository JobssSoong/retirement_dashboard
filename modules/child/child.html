<div class='card p-5'>
  <div class='flex items-center justify-between mb-3'>
    <h3 class='text-lg font-semibold text-white border-l-4 border-[#f59e0b] pl-3'>子女模拟器 <a class='cred-badge cred-infer' href='#app-child' data-tip='养育成本有据；子女支持为假设。点击查看'>推测</a></h3>
    <label class='flex items-center gap-2 cursor-pointer text-sm text-gray-300'>
      <input id='childEnable' type='checkbox' class='w-4 h-4 align-middle accent-[#f59e0b]'> 启用
    </label>
  </div>
  <div id='childConfig' class='hidden space-y-4'>
    <div class='text-xs text-gray-500 bg-[#2a2a2e]/60 rounded p-2'>提示：孩子不是投资品。本模块仅量化<b>可测量的经济影响</b>——养育支出会挤压养老储蓄（抬高每月需存），子女支持为<b>你自填的假设值</b>（非预测）。<b>不构成生育建议。</b></div>
    <div class='grid grid-cols-1 sm:grid-cols-2 gap-4'>
      <div>
        <label class='block text-xs text-gray-300 mb-0.5'>抚养档次</label>
        <select id='childTier' class='w-full text-sm'>
          <option value='rural'>农村（约45万/孩）</option>
          <option value='urbanBasic'>城镇普通（约68万）</option>
          <option value='urbanMid'>城镇中产（约82万）</option>
          <option value='tier1'>一线城市（约120万）</option>
        </select>
        <div class='text-[11px] text-gray-500 mt-0.5'>每孩养到22岁总成本（当前购买力），按0-22岁均摊到各年。</div>
      </div>
      <div>
        <label class='block text-xs text-gray-300 mb-0.5'>孩子年龄（岁；负数=几年后生；留空=无）</label>
        <div class='flex gap-2'>
          <input id='childAge1' type='number' placeholder='孩1' class='w-20 text-sm'>
          <input id='childAge2' type='number' placeholder='孩2' class='w-20 text-sm'>
          <input id='childAge3' type='number' placeholder='孩3' class='w-20 text-sm'>
        </div>
      </div>
    </div>
    <div>
      <div class='flex justify-between text-xs mb-0.5'><span class='text-gray-300'>假设子女晚年年均支持</span><span class='text-[#f59e0b] font-mono' id='childSupportValue'>--</span></div>
      <input id='childSupportSlider' type='range' min='0' max='5' step='0.1' class='w-full'>
      <div class='text-[11px] text-gray-500 mt-0.5'>万/年（购买力）。参考：城镇约3-5千/农村约1.5-4千元/年。默认0，按你判断填。</div>
    </div>
    <div id='childImpact' class='text-xs text-gray-300 bg-[#2a2a2e]/60 rounded p-2'>--</div>
  </div>
</div>
