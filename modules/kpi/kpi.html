<div class='card p-5 relative overflow-hidden'>
  <div class='text-sm text-gray-400 mb-1'>所需养老储蓄额<span class='text-gray-600'>（家庭·购买力）</span></div>
  <div class='text-2xl md:text-3xl font-bold text-white kpi-number' id='corpusReal'>--</div>
  <div class='text-xs text-gray-500 mt-2'>退休时账面金额：<span id='corpusNominal' class='text-[#e94560] font-mono'>--</span></div>
  <div class='text-xs text-gray-400 mt-1'>当前已攒 <span id='savingsRatio' class='font-mono'>--</span></div>
  <div class='w-full bg-gray-700 h-2 rounded-full mt-2 overflow-hidden'><div id='savingsBar' class='h-full bg-[#e94560]' style='width:0%'></div></div>
  <div class='formula'>
    <span class="var">所需储蓄</span> $C=\dfrac{-F_T}{(1+r)^{T}}$，$F_T$=退休净现金流（养老金收入−支出）累积到预期寿命的终值
  </div>
</div>
<div class='card p-5'>
  <div class='text-sm text-gray-400 mb-1'>家庭每月需存<span class='text-gray-600'>（购买力·每月一样）</span></div>
  <div class='text-2xl md:text-3xl font-bold text-[#e94560] kpi-number' id='depositRealMonthly'>--</div>
  <div class='text-xs text-gray-500 mt-2' id='depositAnnual'>--</div>
  <div class='formula'>
    <span class="var">每月需存</span>（购买力恒定）$D=\dfrac{A}{12}$，$A$ 由 $C$、当前已存、距退休年数按累积口径反解
  </div>
</div>
<div class='card p-5'>
  <div class='text-sm text-gray-400 mb-1'>家庭每月需存<span class='text-gray-600'>（账面·按通胀递增）</span></div>
  <div class='text-2xl md:text-3xl font-bold text-white kpi-number' id='depositNominal'>--</div>
  <div class='text-xs text-gray-500 mt-2'>末年每月：<span id='depositNominalLast' class='text-[#e94560] font-mono'>--</span></div>
  <div class='formula'>
    第 $k$ 年每月 $=D\cdot(1+\pi)^{k}$，$\pi$=年通胀率；首年 $=D$、末年 $=D(1+\pi)^{n-1}$
  </div>
</div>
<div class='card p-5'>
  <div class='text-sm text-gray-400 mb-1'>退休倒计时</div>
  <div class='text-2xl md:text-3xl font-bold text-white kpi-number' id='countdownDisplay'>--</div>
  <div class='text-xs text-gray-500 mt-2'>距本人退休年龄</div>
</div>
