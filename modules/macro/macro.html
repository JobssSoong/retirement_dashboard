<div class='card p-5'>
  <h3 class='text-lg font-semibold text-white border-l-4 border-[#e94560] pl-3 mb-4'>宏观数据仪表盘</h3>
  <div class='grid grid-cols-1 sm:grid-cols-2 gap-4'>
    <div><div id='cpiChart' class='h-[190px] rounded-xl overflow-hidden bg-[#16213e]/30'></div><div class='text-xs text-gray-500 mt-1'>居民消费价格指数（CPI）同比涨幅，反映历年通胀水平。</div></div>
    <div><div id='depositChart' class='h-[190px] rounded-xl overflow-hidden bg-[#16213e]/30'></div><div class='text-xs text-gray-500 mt-1'>一年期人民币存款基准利率年末水平，反映无风险收益变迁。</div></div>
    <div><div id='savingsChart' class='h-[190px] rounded-xl overflow-hidden bg-[#16213e]/30'></div><div class='text-xs text-gray-500 mt-1'>国内总储蓄率（占 GDP）年度走势，衡量整体储蓄强度。</div></div>
    <div><div id='m2gdpChart' class='h-[190px] rounded-xl overflow-hidden bg-[#16213e]/30'></div><div class='text-xs text-gray-500 mt-1'>M2 同比增速与实际 GDP 增速对比，差距反映货币超发程度。</div></div>
  </div>
  <div class='source-tag'>数据来源：CPI / GDP / 储蓄率 — 国家统计局；存款基准利率、M2 — 中国人民银行。储蓄率为「国民总储蓄率（占 GDP）」，口径见 World Bank。</div>
</div>
