<!DOCTYPE html>
<html lang='zh-CN'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>养老看板 Retirement Dashboard</title>
  <!-- 第三方库 -->
  <script src='https://cdn.tailwindcss.com'></script>
  <script src='https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js'></script>
  <!-- KaTeX 数学公式渲染 -->
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css'>
  <script defer src='https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js'></script>
  <script defer src='https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js'></script>
  <!-- 共享层（顺序：数据 → 计算 → 状态 → 主题 → 加载器） -->
  <script src='shared/data.js'></script>
  <script src='shared/calc.js'></script>
  <script src='shared/store.js'></script>
  <script src='shared/theme.js'></script>
  <script src='shared/dashboard.js'></script>
  <link rel='stylesheet' href='app.css'>
</head>
<body class='min-h-screen'>
  <div id='dashboard' class='p-4 md:p-6 max-w-[1920px] mx-auto space-y-6'>

    <header class='card flex flex-col md:flex-row md:items-center justify-between p-5 gap-4'>
      <div>
        <h1 class='text-2xl md:text-3xl font-bold text-white tracking-wide'>养老看板 <span class='text-[#2dd4bf] text-base md:text-lg font-normal opacity-80'>Retirement Dashboard</span></h1>
      </div>
      <div class='flex items-center gap-3 flex-wrap'>
        <span id='currentDate' class='text-sm text-gray-300 bg-black/20 px-3 py-1.5 rounded-lg'></span>
        <button id='refreshBtn' class='px-4 py-2 rounded-lg bg-[#16213e] hover:bg-[#1e2d4d] text-white text-sm transition border border-gray-600'>刷新</button>
      </div>
    </header>

    <!-- 各独立面板：由加载器 fetch 注入；class 仅用于外层栅格布局 -->
    <div data-module='kpi' class='grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4'></div>
    <div data-module='growth'></div>

    <div class='grid grid-cols-1 lg:grid-cols-2 gap-6'>
      <div data-module='pyramid'></div>
      <div data-module='macro'></div>
    </div>

    <div class='grid grid-cols-1 lg:grid-cols-2 gap-6'>
      <div data-module='asset'></div>
      <div data-module='heatmap'></div>
    </div>

    <div data-module='appendix'></div>

    <footer class='text-center text-xs text-gray-500 py-6 space-y-2'>
      <p>数据来源：国家统计局、中国人民银行、联合国人口司（UN World Population Prospects 2024）；最后更新时间：2026-07-31。</p>
      <p>免责声明：本看板仅供参考，不构成任何投资建议。实际投资收益、通胀水平及寿命存在重大不确定性，请结合自身情况谨慎决策。</p>
    </footer>
  </div>

  <script>
    async function boot() {
      // 依次加载所有面板
      const containers = document.querySelectorAll('[data-module]');
      for (const c of containers) {
        await Dashboard.load(c.dataset.module, c);
      }
      // 窗口尺寸变化 → 通知各面板重置图表尺寸
      window.addEventListener('resize', () => Dashboard.resizers.forEach(fn => fn && fn()));

      // 同步 range 滑块的渐变填充（拖动时实时 + 各面板更新后）
      const updFill = el => { const min = +el.min || 0, max = +el.max || 100; el.style.setProperty('--p', ((+el.value - min) / (max - min) * 100) + '%'); };
      document.addEventListener('input', e => { if (e.target && e.target.type === 'range') updFill(e.target); });
      Store.subscribe(() => document.querySelectorAll('#dashboard input[type=range]').forEach(updFill));

      // header 交互
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-CN', {year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'});
      document.getElementById('refreshBtn').addEventListener('click', () => Store.changed());

      // 首次全量渲染
      Store.changed();
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
